<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Co-op Survival</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e1116;
        color: #e6e6e6;
        font-family: system-ui, sans-serif;
      }
      #game { display: block; max-width: 100vw; max-height: 100vh; background: #171b22; cursor: crosshair; }
      #join {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(14, 17, 22, 0.92);
      }
      #join h1 { margin: 0 0 8px; }
      #join input, #join button { font-size: 18px; padding: 8px 14px; border-radius: 6px; border: 1px solid #444; }
      #join input { background: #222; color: #eee; }
      #join button { background: #4fc3f7; color: #0e1116; border: none; cursor: pointer; font-weight: 600; }
      #join p { color: #999; max-width: 420px; text-align: center; line-height: 1.5; }
      #error { color: #f06292; min-height: 1.2em; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="game" width="1200" height="800"></canvas>
    <form id="join">
      <h1>Co-op Survival</h1>
      <input id="name" placeholder="Your name" maxlength="16" autocomplete="off" required />
      <button type="submit">Join game</button>
      <div id="error"></div>
      <p>WASD / arrows to move · mouse to aim · click to shoot.<br />
        Stand next to a downed teammate to revive them. Survive as many waves as you can!</p>
    </form>
    <script type="module" src="/bundle.js"></script>
  </body>
</html>
