<!doctype html>
<!-- Test page: the park (the same scripts as park.html) with tools/playtest-park.js, which plays it with simulated keys. -->
<html lang="en"><head><meta charset="utf-8"><base href="../">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Park</title>
<style>
  html,body{margin:0;height:100%;background:#1c120a;overflow:hidden;touch-action:none}
  canvas{display:block}
  #load{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#1c120a;color:#e9c98a;font:italic 22px Georgia,serif;transition:opacity .6s}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="load">The Park</div>
<script>addEventListener('error', (e) => fetch('/log', { method: 'POST', body: 'PLAY FAILED error: ' + e.message + ' (' + String(e.filename).split('/').pop() + ' line ' + e.lineno + ')' }));</script>
<script src="shared/helpers.js"></script>
<script src="worlds/forest/assets/manifest.js"></script>
<script src="worlds/city/assets/manifest.js"></script>
<script src="worlds/park/settings.js"></script>
<script src="shared/characters/shared.js"></script>
<script src="shared/characters/sister.js"></script>
<script src="shared/characters/brother.js"></script>
<script src="shared/sound.js"></script>
<script src="shared/stage.js"></script>
<script src="shared/physics.js"></script>
<script src="shared/icons.js"></script>
<script src="shared/movement.js"></script>
<script src="shared/kit.js"></script>
<script src="shared/chapter.js"></script>
<script>const LOAD = { title: 'The Park', script: ['worlds/park/scenery.js', 'worlds/park/things.js', 'worlds/park/life.js', 'worlds/park/learn.js', 'worlds/park/level.js'], sets: [
  { assets: CITY_ASSETS, base: 'worlds/city/assets/', only: ['skylineFar', 'skylineNear', 'streetLamp', 'bench', 'parkGate'] },            // borrowed from the city
  { assets: FOREST_ASSETS, base: 'worlds/forest/assets/', only: ['clouds', 'trees', 'blossomTrees', 'pines', 'bushes', 'flowers', 'grass', 'rocks', 'logs', 'grassTexture', 'pathTexture'] }, // and from the forest
] };</script>
<script src="shared/loader.js"></script>
<script src="tools/playtest-park.js"></script>
</body></html>
