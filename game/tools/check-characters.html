<!doctype html>
<!-- Test page: draws both characters in 24 fixed poses, the way the house (through shared/stage.js) and the forest
     (directly) draw them, and reports one number for all the pixels to the dev server log: "HASH characters a2a2276".
     The number must stay the same after a change to shared/characters/ or shared/stage.js, unless the change was meant
     to alter how the characters look in the house and the forest. (It was a2a2276 on 2026-11-21, in Edge at 1920x1080.) -->
<html lang="en"><head><meta charset="utf-8"><base href="../">
<style>html,body{margin:0;background:#888}canvas{display:block}</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="shared/helpers.js"></script>
<script src="shared/characters/shared.js"></script>
<script src="shared/characters/sister.js"></script>
<script src="shared/characters/brother.js"></script>
<script src="shared/stage.js"></script>
<script>
'use strict';
const game = { queue: [], bubble: null, sparks: [], objective: '', objT: 0 };
let camX = 0;
(async () => {
  // a fixed size, whatever the window is
  cv.width = 1920; cv.height = 1080; S = 1; VW = 1920; CS = 1;
  for (const b of [buf, rim]) { b.cv.width = Math.ceil(BW * CS); b.cv.height = Math.ceil(BH * CS); }
  let h = 0x811c9dc5, n = 0;
  const mix = () => { const d = ctx.getImageData(0, 0, 1920, 1080).data; for (let i = 0; i < d.length; i += 1) { h ^= d[i]; h = Math.imul(h, 0x01000193) >>> 0; } n++; };
  const mk = (who, i) => { const p = makePlayer(who, 0, 0, 1); p.blink = 2; return p; };
  const faces = [{}, { happy: 1, smile: 1, mouth: 0.9, brow: 0.9 }, { tilt: 0.95, smile: -0.5, sweat: 1, mouth: 0.22 }, { open: 0.4, mouth: 0.8, mw: 0.62 }, { arm: 1 }, { arm: 0.5, head: -0.1 }];
  for (let round = 0; round < 6; round++) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#b9a98a'; ctx.fillRect(0, 0, 1920, 1080);
    let k = 0;
    for (const who of ['sister', 'brother']) for (let i = 0; i < 12; i++) {
      const p = mk(who, i); p.x = 100 + (k % 12) * 150; p.y = 420 + Math.floor(k / 12) * 440; k++;
      p.dir = i % 5 === 3 ? -1 : 1; p.m = [0, 0.3, 1, 1, 0.6, 1][(i + round) % 6]; p.phase = i * 0.7 + round * 1.3;
      Object.assign(p.ex, faces[(i + round) % faces.length]); p.ex.blinkF = i % 4 === 0 ? 0.1 : 1;
      p.cheer = (i + round) % 7 === 0 ? 0.6 : 0; p.giggle = (i + round) % 5 === 0 ? 0.5 : 0;
      p.scale = i % 6 === 5 ? 0.9 : 1; p.alpha = 1;
      if (round % 2 === 0) drawChar(p, 1.234 + i * 0.37 + round);          // the way the house draws them
      else { ctx.save(); ctx.translate(p.x, p.y); ctx.scale(p.dir * 0.92, 0.92); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; p.t = 2.5 + i * 0.21; p.draw(ctx, p, p.t); ctx.restore(); } // the way the forest does
    }
    mix();
  }
  const out = 'HASH characters ' + h.toString(16) + ' frames ' + n;
  document.title = out;
  if (new URLSearchParams(location.search).get('snap')) await fetch('/log', { method: 'POST', body: 'SNAP ' + cv.toDataURL('image/png') });
  fetch('/log', { method: 'POST', body: out });
})();
</script>
</body></html>
