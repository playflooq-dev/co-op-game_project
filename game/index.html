<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Treasure Hunt</title>
<!-- The game starts here, with Chapter 1 (three levels: the park, the city, the canal).
     The first time, this page passes straight on to Level 1, park.html. Once a game has been started in this
     browser, it opens the chapter map, map.html, where players go on from where they stopped.
     Anything after the ? in the address goes to the park as before (index.html?section=3 opens park.html?section=3).
     What has been played is remembered by shared/chapter.js. The house is house.html, the forest scene forest.html. -->
<style>html,body{margin:0;height:100%;background:#1c120a}</style>
<script src="shared/chapter.js"></script>
<script>
  var q = location.search, started = false;
  try { started = CHAPTER.started(); } catch (e) { started = false; }
  location.replace((q ? 'park.html' : started ? 'map.html' : 'park.html') + q + location.hash);
</script>
<noscript><meta http-equiv="refresh" content="0;url=park.html"></noscript>
</head><body></body></html>
